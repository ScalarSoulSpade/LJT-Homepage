name: Validate site and Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: List generated files
        run: find _site -maxdepth 2 -type f | sort | head -100
      - name: Query Pages API
        run: |
          curl -sS -i \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages | head -80
      - name: Check live URL
        run: |
          sleep 20
          curl -sS -L -o /tmp/site.html -w "HTTP %{http_code}\n" https://scalarsoulspade.github.io/LJT-Homepage/ || true
          head -40 /tmp/site.html || true
