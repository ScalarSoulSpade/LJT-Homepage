name: Diagnose Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Pages configuration
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
      - name: Check site URL
        run: |
          url="https://scalarsoulspade.github.io/LJT-Homepage/"
          code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$url" || true)
          echo "HTTP $code"
          head -c 1200 /tmp/page.html || true
